[workspace]
resolver = "2"
members = ["libs/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "rt"] }
futures-util = "0.3"

# Matrix protocol
matrix-sdk = { version = "0.18.0", default-features = false, features = ["sso-login", "e2e-encryption", "bundled-sqlite"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmp-serde = "1"

# Media / images
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mime = "0.3"
arboard = "3"
percent-encoding = "2"

# Misc
log = "0.4"
rand = "0.8"
base64 = "0.22"
markup = "0.15"
rusqlite = "0.37.0"
open = "5"

# Internal crates
keychain = { path = "libs/keychain" }
types = { path = "libs/types" }
storage = { path = "libs/storage" }
protocol = { path = "libs/protocol" }
assets = { path = "libs/assets" }
auth = { path = "libs/auth" }
verification = { path = "libs/verification" }
chat = { path = "libs/chat" }
rooms = { path = "libs/rooms" }

[package]
name = "singularity"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "singularity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-log = "2"

log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
matrix-sdk = { workspace = true }

types = { workspace = true }
storage = { workspace = true }
protocol = { workspace = true }
assets = { workspace = true }
auth = { workspace = true }
verification = { workspace = true }
chat = { workspace = true }
rooms = { workspace = true }

[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

